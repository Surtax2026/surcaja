<style>

<script>
(function(){
"use strict";
const IVA=0.19;
const CAT_ORDEN=["manicure","pedicure","pestañas","depilación"];
function catOrd(c){const i=CAT_ORDEN.indexOf(String(c||"").trim().toLowerCase());return i<0?CAT_ORDEN.length:i}
const MEDIOS=[["tarjeta","Tarjeta (Mercado Pago)"],["efectivo","Efectivo"],["transferencia","Transferencia"],["giftcard","Gift card"]];
function gcPseudo(){return(S.gcDia||[]).filter(g=>g.estado!=="anulada").map(g=>({id:"gc-"+g.id,venta:+g.valorVenta||0,propina:0,medio:g.medioVenta,operacion:g.opVenta||"",profNombre:"Venta gift card "+g.id,hora:g.horaVenta||"",estado:"ok",comisionPct:0,base:"bruto"}))}
const MODELOS={contrato:"Contrato de trabajo",honorarios:"Honorarios",arriendo:"Arriendo de sillón",transicion:"En transición (sin documento)"};
function diasHasta(f){if(!f)return null;const [y,m,d]=String(f).split("-").map(Number);const t=new Date(y,m-1,d),h=new Date();h.setHours(0,0,0,0);return Math.round((t-h)/864e5)}
const S={db:null,user:null,dl:null,admin:false,ready:false,offline:false,
  tab:"agenda",pros:[],servs:[],cfg:{base:"neto"},
  dia:hoy(),regsDia:[],cierreDia:null,unsubDia:null,unsubCierre:null,
  sel:{pro:null,items:{},cobrado:null,manual:false,propina:"",medio:"tarjeta",op:"",nota:""},
  liq:{desde:lunes(),hasta:hoy(),rows:null,regs:null,cargando:false,pro:""},
  rep:{desde:hoy().slice(0,8)+"01",hasta:hoy(),pro:"",cat:"",medio:"",vista:"detalle",regs:null,cargando:false},
  saving:false,mpDia:null,unsubMp:null,mpImp:null,
  agDia:hoy(),citasSem:[],citasMan:[],unsubSem:null,unsubMan:null,clientas:[],form:null,det:null,
  cli:{q:"",sel:null,hist:null,nuevo:false}};

function hoy(){const d=new Date();return ymd(d)}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function lunesDe(s){const [y,m,d]=s.split("-").map(Number);const t=new Date(y,m-1,d);t.setDate(t.getDate()-((t.getDay()+6)%7));return ymd(t)}
function masDias(s,n){const [y,m,d]=s.split("-").map(Number);const t=new Date(y,m-1,d+n);return ymd(t)}
function lunes(){const d=new Date();const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);return ymd(d)}
function fechaLarga(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"})}
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clp=n=>"$"+Math.round(Number(n)||0).toLocaleString("es-CL");
const int=v=>{const n=Math.round(Number(String(v).replace(/[^\d-]/g,"")));return isFinite(n)&&n>0?n:0};
function calc(venta,pct,base){const neto=Math.round(venta/(1+IVA));const iva=venta-neto;const b=base==="bruto"?venta:neto;const com=Math.round(b*(pct||0)/100);return{neto,iva,com,salon:neto-com}}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{t.hidden=true},3200)}

/* ---------- Conexión ---------- */
async function init(){
  const c=window.claude;
  if(!c||typeof c.use!=="function"){S.offline=true;render();return}
  let db=null,user=null,dl=null;
  try{[db,user,dl]=await Promise.all([c.use("db"),c.use("user"),c.use("downloads")])}catch(e){}
  S.db=db;S.user=user;S.dl=dl;
  if(!db){S.offline=true;render();return}
  try{S.admin=user?await user.canEdit():false}catch(e){S.admin=false}
  S.rol=user&&user.rol?user.rol():(S.admin?"admin":"caja");S.myPro=user&&user.profId?user.profId():null;
  if(S.myPro){S.tab="registrar";S.sel.pro=S.myPro}
  if(S.admin)db.collection("usuarios").onSnapshot(q=>{S.usuarios=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.email).localeCompare(String(b.email)));render()},err);
  if(S.myPro)db.doc("profesionales/"+S.myPro).onSnapshot(s=>{S.pros=s.exists?[{id:s.id,...s.data()}]:[];S.ready=true;render()},err);else
  db.collection("profesionales").onSnapshot(q=>{S.pros=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre),"es"));S.ready=true;render()},err);
  db.collection("servicios").onSnapshot(q=>{S.servs=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>catOrd(a.categoria)-catOrd(b.categoria)||String(a.categoria||"").localeCompare(String(b.categoria||""),"es")||String(a.nombre).localeCompare(String(b.nombre),"es"));render()},err);
  db.doc("config/general").onSnapshot(s=>{S.cfg=Object.assign({base:"neto"},s.exists?s.data():{});render()},err);
  if(!S.myPro)db.collection("clientas").onSnapshot(q=>{S.clientas=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.nombre).localeCompare(String(b.nombre),"es"));render()},err);

function captureFocus(){const a=document.activeElement;if(!a||!a.id)return null;const k={id:a.id,s:a.selectionStart,e:a.selectionEnd};if((a.tagName==="INPUT"&&!/^(checkbox|radio|button|submit)$/.test(a.type))||a.tagName==="TEXTAREA")k.v=a.value;return k}
function restoreFocus(k){if(!k)return;const el=document.getElementById(k.id);if(el){if(k.v!=null&&el.value!==k.v)el.value=k.v;el.focus();try{if(k.s!=null)el.setSelectionRange(k.s,k.e)}catch(e){}}}

}

function resumen(regs){
  const ok=regs.filter(r=>r.estado!=="anulado");
  const t={n:ok.length,venta:0,prop:0,neto:0,iva:0,com:0,porMedio:{tarjeta:{n:0,v:0,p:0},efectivo:{n:0,v:0,p:0},transferencia:{n:0,v:0,p:0}},porPro:{}};
  ok.forEach(r=>{const c=calc(r.venta,r.comisionPct,r.base);t.venta+=r.venta;t.prop+=r.propina||0;t.neto+=c.neto;t.iva+=c.iva;t.com+=c.com;
    const m=t.porMedio[r.medio]||(t.porMedio[r.medio]={n:0,v:0,p:0});const op=String(r.operacion||"").trim();if(!m.ops)m.ops=new Set();if(op){if(!m.ops.has(op)){m.ops.add(op);m.n++}}else m.n++;m.v+=r.venta;m.p+=r.propina||0;
    const k=r.profId;const pp=t.porPro[k]||(t.porPro[k]={nombre:r.profNombre,modelo:r.modelo,n:0,venta:0,neto:0,iva:0,com:0,prop:0});
    pp.n++;pp.venta+=r.venta;pp.neto+=c.neto;pp.iva+=c.iva;pp.com+=c.com;pp.prop+=r.propina||0});
  return t;
}

/* ---------- Mercado Pago ---------- */
const MPCOLS=[["op","N° de operación"],["fecha","Fecha"],["monto","Monto cobrado"],["propina","Propina"],["comision","Comisión Mercado Pago"],["estado","Estado"]];
function pMonto(v){if(typeof v==="number")return Math.round(v);let s=String(v==null?"":v).replace(/[^\d.,-]/g,"");if(!s)return 0;const c=s.lastIndexOf(","),d=s.lastIndexOf(".");
  if(c>-1&&d>-1){s=c>d?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"")}
  else if(c>-1){s=/,\d{1,2}$/.test(s)?s.replace(",","."):s.replace(/,/g,"")}
  else if(d>-1&&/^-?\d{1,3}(\.\d{3})+$/.test(s)){s=s.replace(/\./g,"")}
  const n=parseFloat(s);return isFinite(n)?Math.round(n):0}
function pFecha(v){
  if(v instanceof Date&&!isNaN(v))return{f:ymd(v),h:String(v.getHours()).padStart(2,"0")+":"+String(v.getMinutes()).padStart(2,"0")};
  if(typeof v==="number"&&v>20000){const d=new Date(Math.round((v-25569)*864e5));return{f:d.toISOString().slice(0,10),h:d.toISOString().slice(11,16)}}
  const s=String(v==null?"":v).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})(?:[T\s](\d{2}:\d{2}))?/);if(m)return{f:`${m[1]}-${m[2]}-${m[3]}`,h:m[4]||""};
  m=s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})(?:[\s,]+(\d{1,2}:\d{2}))?/);if(m){const y=m[3].length===2?"20"+m[3]:m[3];return{f:`${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`,h:m[4]?m[4].padStart(5,"0"):""}}
  return null}
function mpDetect(h){const m={},used=new Set();const pick=(k,res)=>{for(const re of res){const i=h.findIndex((x,ix)=>!used.has(ix)&&re.test(String(x)));if(i>-1){m[k]=i;used.add(i);return}}m[k]=-1};
  pick("op",[/operation_id|n[uú]mero de operaci|operaci[oó]n/i,/^id$|transacci/i]);
  pick("fecha",[/date_created|fecha de (origen|creaci|compra)/i,/fecha|date/i]);
  pick("propina",[/propina|tip_amount|\btip\b/i]);
  pick("comision",[/comisi|fee|cargo|costo/i]);
  pick("estado",[/estado|status/i]);
  pick("monto",[/transaction_amount|valor del producto|monto bruto|total|valor/i,/monto|amount|importe/i]);
  return m}
function mpParse(rows){let hi=rows.findIndex((r,i)=>i<20&&r.filter(c=>String(c==null?"":c).trim()!=="").length>=3&&r.some(c=>/operaci|operation|fecha|date/i.test(String(c==null?"":c))));if(hi<0)hi=0;
  const header=(rows[hi]||[]).map(c=>String(c==null?"":c).trim());return{header,data:rows.slice(hi+1).filter(r=>r.some(c=>String(c==null?"":c).trim()!==""))}}
function mpOps(imp){const m=imp.map;const g=(r,k)=>m[k]>-1?r[m[k]]:"";
  return imp.data.map(r=>{const fe=pFecha(g(r,"fecha"));const est=String(g(r,"estado")||"");
    return{op:String(g(r,"op")==null?"":g(r,"op")).trim().replace(/\.0+$/,""),fecha:fe?fe.f:"",hora:fe?fe.h:"",monto:pMonto(g(r,"monto")),propina:pMonto(g(r,"propina")),comision:Math.abs(pMonto(g(r,"comision"))),estado:est,
      valido:!/rechaz|cancel|devuel|reembols|refund|reject|anula|contracargo|charged/i.test(est)}}).filter(o=>o.op&&o.fecha)}
function concilia(){const mp=S.mpDia;if(!mp||!Array.isArray(mp.ops))return null;
  const regs=S.regsDia.concat(gcPseudo()).filter(r=>r.estado!=="anulado"&&r.medio==="tarjeta");const byOp={};
  regs.forEach(r=>{const k=String(r.operacion||"").trim();if(k)(byOp[k]=byOp[k]||[]).push(r)});
  const opsSet=new Set(mp.ops.map(o=>o.op));const sueltos=regs.filter(r=>!opsSet.has(String(r.operacion||"").trim()));
  const rows=[],usados=new Set(),usadosR=new Set();
  mp.ops.forEach(o=>{let rs=byOp[o.op]||[];usados.add(o.op);const total=mp.incluyePropina?o.monto:o.monto+o.propina;let porMonto=false;
    if(!rs.length&&o.valido&&o.hora){const c=sueltos.find(r=>!usadosR.has(r.id)&&r.venta+(r.propina||0)===total&&Math.abs(toMin(r.hora)-toMin(o.hora))<=20);if(c){rs=[c];usadosR.add(c.id);porMonto=true}}
    const reg=rs.length?rs.reduce((a,r)=>a+r.venta+(r.propina||0),0):null;
    let est;if(!o.valido)est=rs.length?"Registro con pago anulado":"Anulado en Mercado Pago";else if(!rs.length)est="Cobro sin registro";else if(reg===total)est=porMonto?"Cuadra (por monto y hora)":"Cuadra";else est="Monto distinto";
    rows.push({op:o.op,hora:o.hora,mp:total,reg,pros:rs.map(r=>r.profNombre).join(", "),est})});
  regs.forEach(r=>{const k=String(r.operacion||"").trim();if((!k||!usados.has(k))&&!usadosR.has(r.id))rows.push({op:k||"(sin número)",hora:r.hora,mp:null,reg:r.venta+(r.propina||0),pros:r.profNombre,est:"Registro sin cobro"})});
  return rows.sort((a,b)=>String(a.hora).localeCompare(String(b.hora)))}
function mpTotales(){const mp=S.mpDia;const val=mp.ops.filter(o=>o.valido);const tot=val.reduce((a,o)=>a+(mp.incluyePropina?o.monto:o.monto+o.propina),0),prop=val.reduce((a,o)=>a+o.propina,0),com=val.reduce((a,o)=>a+o.comision,0);return{n:val.length,tot,prop,com}}
function vMP(){

    <div class="row-btns"><button class="btn" data-act="mp-guardar" ${ops.length?"":"disabled"}>Guardar ${fechas.length} día(s) en SurCaja</button><button class="btn sec" data-act="mp-cancelar">Cancelar</button></div>`}

    ${rows.map(r=>{const p=String(r.est).startsWith("Cuadra")?"g":r.est==="Monto distinto"?"a":r.est==="Anulado en Mercado Pago"?"n":"r";return`<tr><td class="num">${esc(r.hora)}</td><td class="num">${esc(r.op)}</td><td>${esc(r.pros||"—")}</td><td class="n">${r.mp==null?"—":clp(r.mp)}</td><td class="n">${r.reg==null?"—":clp(r.reg)}</td><td class="n">${r.mp==null||r.reg==null?"—":clp(r.reg-r.mp)}</td><td><span class="pill ${p}">${esc(r.est)}</span></td></tr>`}).join("")}
    </tbody></table></div>
    ${S.admin?`<div class="row-btns"><button class="btn sec" data-act="mp-usar">Usar estos totales en el cierre</button></div>`:""}
    <p class="status">Importado el ${esc(new Date(mp.importado).toLocaleString("es-CL"))} desde ${esc(mp.archivo||"archivo")}.</p>`}

async function reciboTrans(id){const L=S.liq;const p=L.rows&&L.rows.porPro[id];if(!p)return;const pf=S.pros.find(x=>x.id===id)||{};

const ESTADOS=[["reservada","Reservada","n"],["confirmada","Confirmada","g"],["llego","Llegó","a"],["atendida","Atendida","g"],["noasistio","No asistió","r"],["cancelada","Cancelada","n"]];

const toMin=h=>{const m=String(h||"").match(/^(\d{1,2}):(\d{2})/);return m?Number(m[1])*60+Number(m[2]):0};
const fromMin=n=>String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
const durDe=s=>Number(s&&s.duracion)||60;
const activa=c=>c.estado!=="cancelada"&&c.estado!=="noasistio";
function horario(){const a=toMin(S.cfg.abre||"10:00"),b=toMin(S.cfg.cierra||"20:00");return{a,b:b>a?b:a+600}}
function citasDe(f){return S.citasSem.filter(c=>c.fecha===f)}
function choques(c,lista){const a=toMin(c.hora),b=a+(Number(c.dur)||0);return lista.filter(x=>x.id!==c.id&&x.profId===c.profId&&x.fecha===c.fecha&&activa(x)&&toMin(x.hora)<b&&toMin(x.hora)+(Number(x.dur)||0)>a)}
function fechaCorta(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("es-CL",{weekday:"short",day:"numeric",month:"short"})}

function vAgenda(){
  const vacio=sinCatalogo();if(vacio)return vacio;

  let g=`<div class="th tl" style="grid-row:1;grid-column:1"></div>`+pros.map((p,i)=>`<div class="th" style="grid-row:1;grid-column:${i+2}">${esc(p.nombre)}</div>`).join("");
  const ahora=new Date(),nowMin=ahora.getHours()*60+ahora.getMinutes();
  for(let r=0;r<filas;r++){const m=H.a+r*PASO,row=r+2,hh=m%30===0;

  dia.forEach(c=>{const i=pros.findIndex(p=>p.id===c.profId);if(i<0)return;
    const st=Math.max(0,Math.round((toMin(c.hora)-H.a)/PASO)),span=Math.max(1,Math.round((Number(c.dur)||PASO)/PASO));

  <div class="grid-wrap"><div class="ag" style="grid-template-columns:${cols};grid-template-rows:auto repeat(${filas},14px)">${g}</div></div>
  <div class="legend">${ESTADOS.map(e=>`<span class="pill ${e[2]}">${e[1]}</span>`).join("")}<span class="pill n">Rayado = bloqueo</span><span class="pill r">Borde rojo = tope de horario</span></div>
  <p class="status">Toca un espacio libre para agendar, o una cita para confirmarla, avisar por WhatsApp o cobrarla.</p>`;

async function guardarCita(){const {F,pro,items,dur,precio,cli}=formCita();
  if(!pro){toast("Elige la profesional");return}
  if(!F.fecha||!F.hora){toast("Elige fecha y hora");return}
  if(F.tipo==="bloqueo"&&!(toMin(F.hasta)>toMin(F.hora))){toast("La hora de término debe ser posterior");return}
  if(F.tipo==="cita"&&!cli&&!F.cliNom.trim()){toast("Indica la clienta");return}
  if(F.tipo==="cita"&&!items.length){toast("Agrega al menos un servicio");return}
  const ch=choques({id:F.id,profId:F.pro,fecha:F.fecha,hora:F.hora,dur},S.citasSem.filter(c=>c.fecha===F.fecha));
  if(ch.length&&!F.forzar&&F.fecha>=lunesDe(S.agDia)&&F.fecha<=masDias(lunesDe(S.agDia),6)){toast("Hay un tope de horario. Revisa o toca “Agendar igual”.");render();return}
  const now=new Date().toISOString();
  try{
    let cId=cli?cli.id:null,cNom=cli?cli.nombre:"",cTel=cli?(cli.telefono||""):"";
    if(F.tipo==="cita"&&!cli){cNom=F.cliNom.trim();cTel=F.cliTel.trim();
      const dup=S.clientas.find(c=>String(c.nombre).toLowerCase()===cNom.toLowerCase()&&telNorm(c.telefono)===telNorm(cTel));
      if(dup)cId=dup.id;else{const r=await S.db.collection("clientas").add({nombre:cNom,telefono:cTel,creado:now,origen:F.origen});cId=r.id}}
    const doc=F.tipo==="bloqueo"?{tipo:"bloqueo",fecha:F.fecha,hora:F.hora,dur,profId:pro.id,profNombre:pro.nombre,motivo:F.motivo.trim(),estado:"reservada",modificado:now}
      :{tipo:"cita",fecha:F.fecha,hora:F.hora,dur,profId:pro.id,profNombre:pro.nombre,clientaId:cId,clientaNombre:cNom,telefono:cTel,
        servicios:items.map(s=>({id:s.id,nombre:s.nombre,precio:Number(s.precio)||0,dur:durDe(s)})),precio,origen:F.origen,nota:F.nota.trim(),modificado:now};
    if(F.id){await S.db.doc("citas/"+F.id).update(doc);toast("Cita actualizada")}
    else{doc.estado="reservada";doc.creado=now;await S.db.collection("citas").add(doc);toast(F.tipo==="bloqueo"?"Horario bloqueado":`Agendada: ${cNom}, ${fechaCorta(F.fecha)} ${F.hora}`)}
    if(F.fecha!==S.agDia){S.agDia=F.fecha;subAgenda()}
    S.form=null;render();
  }catch(e){fail(e)}
}

/* --- Detalle de cita y WhatsApp --- */
function telNorm(t){let d=String(t||"").replace(/\D/g,"");if(!d)return"";if(d.startsWith("56"))return d;if(d.length===9&&d[0]==="9")return"56"+d;if(d.length===8)return"569"+d;return d}
function msjWsp(c,k){const nom=String(c.clientaNombre||"").split(" ")[0]||"";const local=S.cfg.local||"NÚASPA";
  const sv=(c.servicios||[]).map(s=>s.nombre).join(", ");const dir=S.cfg.direccion?` en ${S.cfg.direccion}`:"";
  if(k==="recordatorio")return`Hola ${nom}! Te recordamos tu hora en ${local}${dir}: ${fechaLarga(c.fecha)} a las ${c.hora}, ${sv} con ${c.profNombre}. Si no puedes asistir, avísanos por aquí para liberar el horario. ¡Te esperamos!`;
  if(k==="cancelada")return`Hola ${nom}, te escribimos de ${local}. Tu hora del ${fechaLarga(c.fecha)} a las ${c.hora} quedó cancelada. Si quieres reagendar, respóndenos y te buscamos un nuevo horario.`;
  return`Hola ${nom}! Te escribimos de ${local} para confirmar tu hora: ${fechaLarga(c.fecha)} a las ${c.hora}, ${sv} con ${c.profNombre}. ¿Nos confirmas tu asistencia? Responde SÍ, o avísanos si necesitas cambiarla.`}
async function enviarWsp(c,k){const t=telNorm(c.telefono);if(!t){toast("Esta clienta no tiene WhatsApp registrado");return}
  window.open("https://wa.me/"+t+"?text="+encodeURIComponent(msjWsp(c,k)),"_blank","noopener");
  const up={modificado:new Date().toISOString()};if(k==="recordatorio")up.recordado=up.modificado;if(k==="confirmacion")up.avisado=up.modificado;
  try{await S.db.doc("citas/"+c.id).update(up)}catch(e){fail(e)}}

  <dt>WhatsApp</dt><dd class="num">${esc(c.telefono||"—")}</dd><dt>Reservó por</dt><dd>${esc((ORIGENES.find(o=>o[0]===c.origen)||["","—"])[1])}</dd>${c.nota?`<dt>Nota</dt><dd>${esc(c.nota)}</dd>`:""}

  <dt>Estado</dt><dd><span class="pill ${e[2]}">${esc(e[1])}</span>${c.registroId?` <span class="muted" style="font-size:13px">cobrada ${clp(c.venta)}</span>`:""}</dd></dl>
  <div class="step" style="gap:8px"><h2>Cambiar estado</h2><div class="chips">${ESTADOS.filter(x=>x[0]!=="atendida").map(x=>`<button class="chip" style="min-height:40px;padding:6px 12px;font-size:14px" data-act="c-estado" data-k="${x[0]}" data-id="${esc(c.id)}" aria-pressed="${c.estado===x[0]}">${x[1]}</button>`).join("")}</div></div>

function vSheet(){if(!S.form&&!S.det)return"";return`<div class="sheet-bg" data-act="sheet-bg"><div class="sheet" role="dialog" aria-modal="true">${S.form?vForm():vDet()}</div></div>`}
function cobrarCita(c){const items={};(c.servicios||[]).forEach(s=>{if(S.servs.find(x=>x.id===s.id))items[s.id]=(items[s.id]||0)+1});
  S.sel={pro:c.profId,items,cobrado:null,manual:false,propina:"",medio:"tarjeta",op:"",nota:"",citaId:c.id,clientaId:c.clientaId||"",clientaNombre:c.clientaNombre||""};
  S.det=null;S.tab="registrar";render();window.scrollTo(0,0)}

      <label for="cl-mail">Correo<input id="cl-mail" type="email" value="${esc(sel.correo||"")}"></label>
      <label for="cl-cumple">Cumpleaños (día y mes)<input id="cl-cumple" value="${esc(sel.cumple||"")}" placeholder="Ej. 14-03"></label></div>
      <label for="cl-notas">Notas de atención<textarea id="cl-notas" rows="3" placeholder="Ej. preferencias de color, forma de uña, sensibilidad de la piel">${esc(sel.notas||"")}</textarea></label>
      <button class="btn" data-act="cli-guardar" data-id="${esc(sel.id)}">Guardar ficha</button></div>

    ${fut.length?`<div class="note info">Próxima: ${esc(fechaCorta(fut[fut.length-1].fecha))} ${esc(fut[fut.length-1].hora)}</div>`:""}</div></div>`}

async function abrirClienta(id){S.cli.sel=id;S.cli.hist=null;S.det=null;S.form=null;S.tab="clientas";render();window.scrollTo(0,0);
  try{const q=await S.db.collection("citas").where("clientaId","==",id).get();if(S.cli.sel===id){S.cli.hist=q.docs.map(d=>({id:d.id,...d.data()}));render()}}catch(e){fail(e)}}

/* ---------- Acciones ---------- */
document.addEventListener("click",async ev=>{
  const nb=ev.target.closest("#nav button");if(nb){if(S.sel&&S.sel.editId&&nb.dataset.tab!=="registrar")S.sel={pro:null,items:{},cobrado:null,manual:false,propina:"",medio:"tarjeta",op:"",nota:""};S.tab=nb.dataset.tab;render();window.scrollTo(0,0);return}
  const b=ev.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act, id=b.dataset.id, sel=S.sel;
  try{
  if(a==="goto"){S.tab=b.dataset.tab;render();return}
  /* agenda */
  if(a==="sheet-bg"){if(ev.target===b){S.form=null;S.det=null;render()}return}
  if(a==="sheet-close"){S.form=null;S.det=null;render();return}
  if(a==="ag-dia"){S.agDia=b.dataset.f;render();return}
  if(a==="ag-hoy"){const w=lunesDe(S.agDia)!==lunesDe(hoy());S.agDia=hoy();S._agScrolled=false;if(w)subAgenda();render();return}
  if(a==="ag-mover"){S.agDia=masDias(S.agDia,Number(b.dataset.n));subAgenda();render();return}
  if(a==="ag-nueva"){nuevaForm({pro:b.dataset.pro||undefined,hora:b.dataset.hora||""});return}
  if(a==="ag-abrir"){S.det=id;S.form=null;render();return}
  if(a==="f-tipo"){S.form.tipo=b.dataset.k;S.form.forzar=false;if(b.dataset.k==="bloqueo"&&!S.form.hasta&&S.form.hora)S.form.hasta=fromMin(toMin(S.form.hora)+60);render();return}
  if(a==="f-pro"){S.form.pro=id;S.form.forzar=false;render();return}
  if(a==="f-svc-del"){S.form.items.splice(Number(b.dataset.i),1);render();return}
  if(a==="f-cli-pick"){S.form.cliId=id;render();return}
  if(a==="f-cli-quitar"){S.form.cliId=null;render();return}
  if(a==="f-forzar"){S.form.forzar=true;render();return}
  if(a==="f-guardar")return guardarCita();
  if(a==="c-estado"){const k=b.dataset.k;await S.db.doc("citas/"+id).update({estado:k,modificado:new Date().toISOString()});
    const c=citaPorId(id);if(c&&S.cli.hist){const h=S.cli.hist.find(x=>x.id===id);if(h)h.estado=k}
    toast("Estado: "+estTxt(k)[1]+(k==="cancelada"&&c&&c.telefono?". Puedes avisarle por WhatsApp.":""));render();return}
  if(a==="c-wsp"){const c=citaPorId(id);if(c)await enviarWsp(c,b.dataset.k);return}
  if(a==="c-cobrar"){const c=citaPorId(id);if(c)cobrarCita(c);return}
  if(a==="c-editar"){const c=citaPorId(id);if(!c)return;
    nuevaForm({id:c.id,tipo:c.tipo||"cita",pro:c.profId,fecha:c.fecha,hora:c.hora,dur:c.dur,durManual:true,items:(c.servicios||[]).map(x=>x.id).filter(x=>S.servs.find(s=>s.id===x)),cliId:c.clientaId||null,cliNom:c.clientaNombre||"",cliTel:c.telefono||"",origen:c.origen||"presencial",nota:c.nota||"",motivo:c.motivo||"",hasta:fromMin(toMin(c.hora)+(Number(c.dur)||0))});return}
  if(a==="c-borrar"){await S.db.doc("citas/"+id).delete();S.det=null;toast("Bloqueo quitado");render();return}
  /* clientas */

async function guardar(){
  const sel=S.sel, pro=S.pros.find(p=>p.id===sel.pro);
  const items=Object.entries(sel.items).map(([id,q])=>{const s=S.servs.find(x=>x.id===id);return s?{id,nombre:s.nombre,categoria:s.categoria||"",precioLista:Number(s.precio)||0,cantidad:q}:null}).filter(Boolean);
  const lista=items.reduce((a,x)=>a+x.precioLista*x.cantidad,0);
  const venta=sel.manual?int(sel.cobrado):lista;
  if(!pro||!venta){toast("Elige profesional y servicio");return}
  const mismoOp=sel.editId&&sel.orig&&String(sel.orig.operacion||"")===String(sel.op||"").trim();
  const dupOp=!mismoOp&&sel.medio==="tarjeta"&&sel.op&&S.regsDia.some(r=>r.id!==sel.editId&&r.operacion===sel.op.trim()&&r.profId===pro.id&&r.estado!=="anulado");
  if(dupOp&&!sel.okOp){sel.okOp=true;toast("Ese voucher ya tiene un servicio de "+pro.nombre+". Si es otro servicio suyo con el mismo voucher, toca Guardar de nuevo");return}
  const now=new Date();
  if(sel.editId&&(sel.medio==="giftcard"||(sel.orig&&sel.orig.medio==="giftcard"))&&sel.medio!==(sel.orig||{}).medio){toast("Un pago con gift card no se puede cambiar editando: anula el servicio, ajusta el saldo en Gift cards y regístralo de nuevo");return}
  if(sel.editId&&sel.orig&&sel.orig.medio==="giftcard"&&venta!==(+sel.orig.venta||0)){toast("El monto de un servicio pagado con gift card no se cambia editando: anúlalo (el saldo vuelve a la gift card) y regístralo de nuevo");return}
  if(sel.editId){const o=sel.orig||{};
    const upd={servicios:items,precioLista:lista,venta,propina:int(sel.propina),medio:sel.medio,operacion:sel.medio==="tarjeta"?sel.op.trim():"",nota:sel.nota.trim(),
      profId:pro.id,profNombre:pro.nombre,fecha:(S.admin&&sel.fecha&&sel.fecha<=ymd(now))?sel.fecha:o.fecha,hora:sel.hora||o.hora,
      modificado:now.toISOString(),editado:true,antes:{servicios:o.servicios||[],venta:o.venta,propina:o.propina||0,profNombre:o.profNombre||""}};
    S.saving=true;refreshPreview();
    try{await S.db.doc("registros/"+sel.editId).update(upd);toast("Cambios guardados: "+pro.nombre);
      S.sel={pro:null,items:{},cobrado:null,manual:false,propina:"",medio:"tarjeta",op:"",nota:""};S.tab="hoy"}catch(e){fail(e)}
    S.saving=false;render();return}
  const pasada=!!(S.admin&&sel.fecha&&sel.fecha<ymd(now));
  let gc=null;if(sel.medio==="giftcard"){const code=String(sel.gc||"").trim().toUpperCase();if(!code){toast("Ingresa el código de la gift card");return}
    try{const g=await S.db.doc("giftcards/"+code).get();if(!g.exists){toast("No existe una gift card con el código "+code);return}gc={id:code,...g.data()}}catch(e){toast("No se pudo revisar la gift card");return}
    if(gc.estado!=="vigente"){toast("La gift card "+code+" está "+gc.estado);return}if((+gc.saldo||0)<venta){toast("Saldo insuficiente: a la gift card le quedan "+clp(gc.saldo));return}}
  if(pasada&&!sel.hora){toast("Indica la hora del cobro (la del voucher)");return}
  const doc={fecha:pasada?sel.fecha:ymd(now),hora:pasada?sel.hora:now.toTimeString().slice(0,5),creado:now.toISOString(),atrasado:pasada,
    profId:pro.id,profNombre:pro.nombre,modelo:pro.modelo||"",comisionPct:Number(pro.comision)||0,base:S.cfg.base==="bruto"?"bruto":"neto",
    servicios:items,precioLista:lista,venta,propina:int(sel.propina),medio:sel.medio,operacion:sel.medio==="tarjeta"?sel.op.trim():"",nota:sel.nota.trim(),estado:"ok",
    citaId:sel.citaId||"",clientaId:sel.clientaId||"",clientaNombre:sel.clientaNombre||"",giftcard:gc?gc.id:""};
  S.saving=true;refreshPreview();
  try{let ref;
    if(gc){ref=S.db.collection("registros").doc();const gref=S.db.doc("giftcards/"+gc.id);
      await S.db.runTransaction(async tx=>{const g=(await tx.get(gref)).data()||{};if(g.estado!=="vigente")throw new Error("gc-estado:"+(g.estado||"no existe"));const sal=+g.saldo||0;if(sal<venta)throw new Error("gc-saldo:"+sal);const ns=sal-venta;
        tx.set(ref,doc);tx.update(gref,{saldo:ns,estado:ns===0?"canjeada":"vigente",canjes:(g.canjes||[]).concat([{fecha:doc.fecha,registroId:ref.id,prof:pro.nombre,monto:venta}])})})}
    else ref=await S.db.collection("registros").add(doc);
    if(sel.citaId){try{await S.db.doc("citas/"+sel.citaId).update({estado:"atendida",registroId:ref.id,venta,modificado:now.toISOString()})}catch(e){console.warn(e)}}
    if(sel.clientaId){try{await S.db.doc("clientas/"+sel.clientaId).update({ultimaVisita:doc.fecha})}catch(e){console.warn(e)}}
    const c=calc(venta,doc.comisionPct,doc.base);
    toast(`Guardado: ${pro.nombre}, comisión ${clp(c.com)}${doc.propina?" + propina "+clp(doc.propina):""}`);
    const fk=S.sel.fecha;S.sel={pro:null,items:{},cobrado:null,manual:false,propina:"",medio:"tarjeta",op:"",nota:"",fecha:fk};
  }catch(e){const m=String(e&&e.message||"");if(m.startsWith("gc-saldo:"))toast("Saldo insuficiente: a la gift card le quedan "+clp(+m.split(":")[1])+". No se guardó el servicio.");else if(m.startsWith("gc-estado:"))toast("La gift card está "+m.split(":")[1]+". No se guardó el servicio.");else fail(e)}
  S.saving=false;render();
}

async function liquidar(){
  const L=S.liq;if(!L.desde||!L.hasta||L.desde>L.hasta){toast("Revisa las fechas");return}
  L.cargando=true;render();
  try{const q=S.myPro?await S.db.collection("registros").where("profId","==",S.myPro).get().then(r=>({docs:r.docs.filter(d=>{const f=d.data().fecha;return f>=L.desde&&f<=L.hasta})})):await S.db.collection("registros").where("fecha",">=",L.desde).where("fecha","<=",L.hasta).get();
    L.regs=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.creado).localeCompare(String(b.creado)));
    L.rows=resumen(L.regs);
  }catch(e){fail(e);L.rows=null}
  L.cargando=false;render();
}

function csvDet(){const L=S.liq;if(!L.regs)return;
  const rows=[["Fecha","Hora","Profesional","Modelo","Servicios","Precio lista","Venta con IVA","IVA","Venta sin IVA","% comisión","Base","Comisión","Propina","Medio","N° operación","Estado","Nota","Id registro"]];
  L.regs.forEach(r=>{const c=calc(r.venta,r.comisionPct,r.base);rows.push([r.fecha,r.hora,r.profNombre,MODELOS[r.modelo]||"",(r.servicios||[]).map(s=>(s.cantidad>1?s.cantidad+"x ":"")+s.nombre).join(" + "),r.precioLista,r.venta,c.iva,c.neto,r.comisionPct,r.base==="bruto"?"con IVA":"sin IVA",r.estado==="anulado"?0:c.com,r.estado==="anulado"?0:(r.propina||0),medioTxt(r.medio),r.operacion,r.estado,r.nota,r.id])});
  save(`Detalle servicios Nua ${L.desde} a ${L.hasta}.csv`,csv(rows));}

/* ---------- Reportes ---------- */
function repLineas(regs){
  const out=[];
  regs.filter(r=>r.estado!=="anulado").forEach(r=>{
    const sv=(r.servicios&&r.servicios.length)?r.servicios:[{nombre:"(sin servicio)",categoria:"",precioLista:r.venta,cantidad:1}];
    const pesos=sv.map(x=>(Number(x.precioLista)||0)*(Number(x.cantidad)||1));const tot=pesos.reduce((a,b)=>a+b,0);
    let restV=r.venta,restP=r.propina||0;
    sv.forEach((x,i)=>{const w=tot>0?pesos[i]/tot:1/sv.length;const ult=i===sv.length-1;
      const v=ult?restV:Math.round(r.venta*w),pr=ult?restP:Math.round((r.propina||0)*w);restV-=v;restP-=pr;
      const c=calc(v,r.comisionPct,r.base);
      out.push({fecha:r.fecha,hora:r.hora,pro:r.profNombre||"",profId:r.profId,cat:x.categoria||"Sin categoría",svc:x.nombre,cant:Number(x.cantidad)||1,medio:r.medio,op:r.operacion||"",
        venta:v,iva:c.iva,neto:c.neto,com:c.com,prop:pr})});
  });
  return out;
}
function repFiltrar(lin){const R=S.rep;return lin.filter(l=>(!R.pro||l.profId===R.pro)&&(!R.cat||l.cat===R.cat)&&(!R.medio||l.medio===R.medio))}
function repAgrupar(lin,key){const g={};lin.forEach(l=>{const k=key(l);const a=g[k]||(g[k]={k,n:0,venta:0,iva:0,neto:0,com:0,prop:0});a.n+=l.cant;a.venta+=l.venta;a.iva+=l.iva;a.neto+=l.neto;a.com+=l.com;a.prop+=l.prop});return Object.values(g)}
function repTot(lin){return repAgrupar(lin,()=>"t")[0]||{n:0,venta:0,iva:0,neto:0,com:0,prop:0}}
const REP_VISTAS=[["detalle","Detalle"],["pro","Por profesional"],["svc","Por servicio"],["cat","Por categoría"],["dia","Por día"]];
function repTabla(lin,vista){
  const cols=`<th class="n">Servicios</th><th class="n">Venta con IVA</th><th class="n">IVA</th><th class="n">Venta sin IVA</th><th class="n">Comisión</th><th class="n">Propinas</th><th class="n">Queda al salón</th>`;
  const nums=a=>`<td class="n">${a.n}</td><td class="n">${clp(a.venta)}</td><td class="n">${clp(a.iva)}</td><td class="n">${clp(a.neto)}</td><td class="n">${clp(a.com)}</td><td class="n">${clp(a.prop)}</td><td class="n">${clp(a.neto-a.com)}</td>`;
  const T=repTot(lin);
  if(vista==="detalle"){const ord=[...lin].sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
    return `<div class="tbl"><table><thead><tr><th>Fecha</th><th>Hora</th><th>Profesional</th><th>Categoría</th><th>Servicio</th><th>Medio</th><th class="n">Venta con IVA</th><th class="n">IVA</th><th class="n">Comisión</th><th class="n">Propina</th></tr></thead><tbody>
    ${ord.map(l=>`<tr><td class="num">${esc(l.fecha)}</td><td class="num">${esc(l.hora)}</td><td>${esc(l.pro)}</td><td>${esc(l.cat)}</td><td>${l.cant>1?l.cant+"× ":""}${esc(l.svc)}</td><td>${esc(medioTxt(l.medio))}</td><td class="n">${clp(l.venta)}</td><td class="n">${clp(l.iva)}</td><td class="n">${clp(l.com)}</td><td class="n">${clp(l.prop)}</td></tr>`).join("")}
    <tr class="tot"><td colspan="6">Total</td><td class="n">${clp(T.venta)}</td><td class="n">${clp(T.iva)}</td><td class="n">${clp(T.com)}</td><td class="n">${clp(T.prop)}</td></tr></tbody></table></div>`}
  const key={pro:l=>l.pro,svc:l=>l.svc,cat:l=>l.cat,dia:l=>l.fecha}[vista];
  const tit={pro:"Profesional",svc:"Servicio",cat:"Categoría",dia:"Día"}[vista];
  let g=repAgrupar(lin,key);
  if(vista==="dia")g.sort((a,b)=>a.k.localeCompare(b.k));else if(vista==="cat")g.sort((a,b)=>catOrd(a.k)-catOrd(b.k)||a.k.localeCompare(b.k,"es"));else g.sort((a,b)=>b.venta-a.venta);
  return `<div class="tbl"><table><thead><tr><th>${tit}</th>${cols}</tr></thead><tbody>
  ${g.map(a=>`<tr><td>${esc(vista==="dia"?fechaLarga(a.k):a.k)}</td>${nums(a)}</tr>`).join("")}
  <tr class="tot"><td>Total</td>${nums(T)}</tr></tbody></table></div>`;
}
function vReportes(){
  if(!S.admin)return`<div class="empty"><strong>Solo Francisca puede ver los reportes</strong></div>`;
  const R=S.rep;const cats=[...new Set(S.servs.map(s=>s.categoria).filter(Boolean))].sort((a,b)=>catOrd(a)-catOrd(b)||a.localeCompare(b,"es"));
  let body="";
  if(R.cargando)body=`<div class="empty"><strong>Cargando…</strong></div>`;
  else if(R.regs){const lin=repFiltrar(repLineas(R.regs));const T=repTot(lin);
    body=lin.length?`<div class="kpis">
      <div class="kpi"><span>Servicios</span><b>${T.n}</b></div><div class="kpi"><span>Ventas con IVA</span><b>${clp(T.venta)}</b></div>
      <div class="kpi"><span>IVA</span><b>${clp(T.iva)}</b></div><div class="kpi"><span>Comisiones</span><b>${clp(T.com)}</b></div>
      <div class="kpi"><span>Propinas</span><b>${clp(T.prop)}</b></div><div class="kpi"><span>Queda al salón (sin IVA)</span><b>${clp(T.neto-T.com)}</b></div></div>
    <div class="chips">${REP_VISTAS.map(([k,l])=>`<button class="chip" style="font-size:14px;padding:10px 14px;min-height:44px" data-act="rep-vista" data-k="${k}" aria-pressed="${R.vista===k}">${l}</button>`).join("")}</div>
    ${repTabla(lin,R.vista)}
    ${S.dl&&window.XLSX?`<div class="row-btns"><button class="btn" data-act="rep-xlsx">Descargar en Excel</button></div><p class="status">El Excel trae una hoja por cada vista y una hoja por profesional.</p>`:""}
    <p class="status">Cuando una atención tiene varios servicios, el monto cobrado se reparte entre ellos según su precio de lista. Los servicios anulados no se cuentan.</p>`
    :`<div class="empty"><strong>No hay servicios con esos filtros</strong><span>Prueba con otras fechas u otra profesional.</span></div>`}
  return `<div><h1>Reportes</h1><p class="muted">Ventas por profesional, servicio, categoría y día.</p></div>
  <div class="panel"><div class="fields">
    <label for="r-desde">Desde<input id="r-desde" type="date" value="${R.desde}"></label>
    <label for="r-hasta">Hasta<input id="r-hasta" type="date" value="${R.hasta}"></label>
    <label for="r-pro">Profesional<select id="r-pro"><option value="">Todas</option>${S.pros.map(p=>`<option value="${esc(p.id)}" ${R.pro===p.id?"selected":""}>${esc(p.nombre)}</option>`).join("")}</select></label>
    <label for="r-cat">Categoría<select id="r-cat"><option value="">Todas</option>${cats.map(c=>`<option value="${esc(c)}" ${R.cat===c?"selected":""}>${esc(c)}</option>`).join("")}</select></label>
    <label for="r-medio">Medio de pago<select id="r-medio"><option value="">Todos</option>${MEDIOS.map(([k,l])=>`<option value="${k}" ${R.medio===k?"selected":""}>${l}</option>`).join("")}</select></label>
    <div style="display:grid;align-items:end"><button class="btn" data-act="rep-cargar">Ver reporte</button></div>
  </div></div>${body}`;
}
async function repCargar(){const R=S.rep;if(!R.desde||!R.hasta||R.desde>R.hasta){toast("Revisa las fechas");return}
  R.cargando=true;render();
  try{const q=await S.db.collection("registros").where("fecha",">=",R.desde).where("fecha","<=",R.hasta).get();R.regs=q.docs.map(d=>({id:d.id,...d.data()}))}catch(e){fail(e);R.regs=null}
  R.cargando=false;render();
}
async function repXlsx(){const R=S.rep;if(!R.regs||!window.XLSX||!S.dl)return;
  const lin=repFiltrar(repLineas(R.regs));const wb=XLSX.utils.book_new();
  const head=["Servicios","Venta con IVA","IVA","Venta sin IVA","Comisión","Propinas","Queda al salón"];
  const fila=a=>[a.n,a.venta,a.iva,a.neto,a.com,a.prop,a.neto-a.com];
  const add=(name,aoa,w)=>{const ws=XLSX.utils.aoa_to_sheet(aoa);ws["!cols"]=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,name.slice(0,31))};
  const ord=[...lin].sort((a,b)=>(a.fecha+a.hora).localeCompare(b.fecha+b.hora));
  add("Detalle",[["Fecha","Hora","Profesional","Categoría","Servicio","Cantidad","Medio","N° operación","Venta con IVA","IVA","Venta sin IVA","Comisión","Propina"],...ord.map(l=>[l.fecha,l.hora,l.pro,l.cat,l.svc,l.cant,medioTxt(l.medio),l.op,l.venta,l.iva,l.neto,l.com,l.prop])],[11,6,14,13,34,9,20,14,13,10,13,11,10]);
  [["Por profesional","Profesional",l=>l.pro],["Por servicio","Servicio",l=>l.svc],["Por categoría","Categoría",l=>l.cat],["Por día","Día",l=>l.fecha]].forEach(([n,t,k])=>{
    const g=repAgrupar(lin,k).sort((a,b)=>t==="Día"?a.k.localeCompare(b.k):b.venta-a.venta);const T=repTot(lin);
    add(n,[[t,...head],...g.map(a=>[a.k,...fila(a)]),["Total",...fila(T)]],[34,10,14,11,14,12,11,14])});
  [...new Set(ord.map(l=>l.pro))].forEach(p=>{const L=ord.filter(l=>l.pro===p);const T=repTot(L);
    add(p||"Sin nombre",[["Fecha","Servicio","Monto","Propina","Comisión"],...L.map(l=>[l.fecha,(l.cant>1?l.cant+"x ":"")+l.svc,l.venta,l.prop,l.com]),["Total","",T.venta,T.prop,T.com]],[11,40,12,10,12])});
  const buf=XLSX.write(wb,{type:"array",bookType:"xlsx"});
  save(`Reporte NUASPA ${R.desde} a ${R.hasta}.xlsx`,new Uint8Array(buf));
}

document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&(S.form||S.det)){S.form=null;S.det=null;render()}});
render();
init();
})();
</script>

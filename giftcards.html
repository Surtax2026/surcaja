<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gift cards SurCaja</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#5b2a6e">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="adapter.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#eef2f5;--surface:#fff;--ink:#132338;--muted:#5b6b7d;--line:#d9e1e8;--navy:#16325c;--navy-soft:#e6ecf5;--plum:#5b2a6e;--sage:#0d7a77;--sage-soft:#e2f2f1;--amber:#b26b12;--amber-soft:#fbefdc;--red:#a3312f;--red-soft:#f8e3e2}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.top{background:var(--surface);border-bottom:2px solid var(--navy);padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.top b{font-size:20px;color:var(--navy);margin-right:auto}.top a{color:var(--navy);font-weight:600}
main{max-width:1040px;margin:0 auto;padding:20px 16px 64px;display:grid;gap:18px}
h1{margin:0;font-size:24px}h2{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{font:16px inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.m{font-family:ui-monospace,Menlo,monospace}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 14px inherit;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.btn{font:700 16px inherit;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--navy);color:#fff}
.btn.sec{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mini{font:600 13px inherit;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:4px 10px;cursor:pointer;text-decoration:none;display:inline-block}
.mini.wsp{background:#1f8a4c;color:#fff;border-color:#1f8a4c}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:2px}
.kpi span{font-size:12px;color:var(--muted);font-weight:600}.kpi b{font-family:ui-monospace,Menlo,monospace;font-size:20px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:820px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--bg)}
td.n,th.n{text-align:right;font-family:ui-monospace,Menlo,monospace;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}
.g{background:var(--sage-soft);color:var(--sage)}.a{background:var(--amber-soft);color:var(--amber)}.r{background:var(--red-soft);color:var(--red)}.n{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.note{border-radius:10px;padding:12px 14px;font-size:14px}.warn{background:var(--amber-soft)}.info{background:var(--navy-soft)}.ok{background:var(--sage-soft)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:24px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;max-width:calc(100% - 32px);z-index:9}
.prev{max-width:360px;width:100%;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.15)}
</style></head><body>
<div class="top"><b>Gift cards · SurCaja</b><a href="./">← Volver a SurCaja</a></div>
<main id="app"><div class="empty">Cargando…</div></main>
<div id="toast" class="toast" hidden></div>
<script>
(function(){"use strict";
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clp=n=>"$"+Math.round(Number(n)||0).toLocaleString("es-CL");
const int=v=>{const n=Math.round(Number(String(v).replace(/[^\d-]/g,"")));return isFinite(n)?n:0};
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const hoy=()=>ymd(new Date());
const MEDIOS=[["tarjeta","Tarjeta (Mercado Pago)"],["efectivo","Efectivo"],["transferencia","Transferencia"]];
const EST={vigente:["Vigente","g"],canjeada:["Canjeada","n"],anulada:["Anulada","r"]};
const vacio=()=>({tipo:"persona",modo:"servicio",servId:"",monto:"",cantidad:1,para:"",de:"",telefono:"",mensaje:"",empresa:"",rutEmpresa:"",contacto:"",medio:"tarjeta",op:"",fecha:hoy()});
const S={db:null,email:"",cfg:{},servs:[],list:[],F:vacio(),saving:false,filtro:"vigente",q:"",sel:null,img:null};
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3500)}
function wsp(tel,txt){let d=String(tel||"").replace(/\D/g,"");if(d.length===8)d="569"+d;else if(d.length===9)d="56"+d;return d?"https://wa.me/"+d+"?text="+encodeURIComponent(txt):"https://wa.me/?text="+encodeURIComponent(txt)}
async function init(){const c=window.claude;S.db=await c.use("db");const u=await c.use("user");
  if(!u||u.rol()!=="admin"){$("#app").innerHTML=`<div class="empty">Solo la administradora puede vender y administrar gift cards. <a href="./">Volver</a></div>`;return}
  S.email=(window.__sxAuth.currentUser||{}).email||"";
  const [cf,sv]=await Promise.all([S.db.doc("config/general").get(),S.db.collection("servicios").get()]);
  S.cfg=cf.exists?cf.data():{};S.servs=sv.docs.map(d=>({id:d.id,...d.data()})).filter(s=>s.activo!==false).sort((a,b)=>String(a.categoria).localeCompare(String(b.categoria),"es")||String(a.nombre).localeCompare(String(b.nombre),"es"));
  S.db.collection("giftcards").onSnapshot(q=>{S.list=q.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.creado).localeCompare(String(a.creado)));render()},e=>{console.warn(e);$("#app").innerHTML=`<div class="empty">No se pudieron leer las gift cards.</div>`})}
function valorUnit(F){if(F.modo==="servicio"){const s=S.servs.find(x=>x.id===F.servId);return s?int(s.precio):0}return int(F.monto)}
function render(){const a=document.activeElement,k=a&&a.id?{id:a.id,s:a.selectionStart,e:a.selectionEnd}:null;$("#app").innerHTML=(S.sel?vDet():vForm()+vResumen()+vLista());if(k){const el=document.getElementById(k.id);if(el){el.focus();try{el.setSelectionRange(k.s,k.e)}catch(e){}}}}
function vForm(){const F=S.F,emp=F.tipo==="empresa",u=valorUnit(F),n=emp?Math.max(1,int(F.cantidad)||1):1;
  return`<div><h1>Gift cards</h1><p class="muted">Vende gift cards para una persona o como regalo corporativo para una empresa. No tienen vencimiento. Cada una tiene un código que la profesional ingresa al atender a la clienta.</p></div>
  <div class="note warn"><b>Pendiente de Surtax:</b> estamos confirmando cómo se declara el IVA de la venta de la gift card y de su canje. Mientras tanto, SurCaja registra la venta y el canje por separado para no perder el detalle.</div>
  <div class="panel"><h2>Nueva venta</h2>
  <div class="row"><span class="muted" style="font-size:13px;font-weight:600">¿Para quién?</span><div class="chips"><button class="chip" data-act="tipo" data-k="persona" aria-pressed="${!emp}">Persona</button><button class="chip" data-act="tipo" data-k="empresa" aria-pressed="${emp}">Empresa (regalo corporativo)</button></div></div>
  <div class="row"><span class="muted" style="font-size:13px;font-weight:600">Incluye:</span><div class="chips"><button class="chip" data-act="modo" data-k="servicio" aria-pressed="${F.modo==="servicio"}">Un servicio</button><button class="chip" data-act="modo" data-k="monto" aria-pressed="${F.modo==="monto"}">Un monto libre</button></div></div>
  <div class="fields">
    ${F.modo==="servicio"?`<label for="gc-serv" style="grid-column:span 2">Servicio<select id="gc-serv" data-f="servId"><option value="">Elegir…</option>${S.servs.map(s=>`<option value="${esc(s.id)}" ${F.servId===s.id?"selected":""}>${esc(s.categoria||"")} · ${esc(s.nombre)} · ${clp(s.precio)}</option>`).join("")}</select></label>`:`<label for="gc-monto">Monto de cada gift card<input id="gc-monto" class="m" inputmode="numeric" data-f="monto" value="${esc(F.monto)}" placeholder="Ej. 30000"></label>`}
    ${emp?`<label for="gc-cant">Cantidad de gift cards<input id="gc-cant" class="m" inputmode="numeric" data-f="cantidad" value="${esc(F.cantidad)}"></label>`:""}
  </div>
  ${emp?`<div class="fields"><label for="gc-emp">Empresa (razón social)<input id="gc-emp" data-f="empresa" value="${esc(F.empresa)}"></label><label for="gc-rut">RUT de la empresa<input id="gc-rut" class="m" data-f="rutEmpresa" value="${esc(F.rutEmpresa)}" placeholder="76.123.456-7"></label><label for="gc-cont">Contacto (nombre)<input id="gc-cont" data-f="contacto" value="${esc(F.contacto)}"></label><label for="gc-tel">Teléfono del contacto<input id="gc-tel" data-f="telefono" value="${esc(F.telefono)}" inputmode="tel"></label></div>
    <p class="muted" style="margin:0;font-size:14px">Se crean ${n} gift card(s) con código propio. Después puedes escribir el nombre de cada destinataria en su ficha.</p>`
  :`<div class="fields"><label for="gc-para">Para (quien la recibe)<input id="gc-para" data-f="para" value="${esc(F.para)}"></label><label for="gc-de">De (quien la regala)<input id="gc-de" data-f="de" value="${esc(F.de)}"></label><label for="gc-tel">Teléfono de quien compra<input id="gc-tel" data-f="telefono" value="${esc(F.telefono)}" inputmode="tel"></label></div>`}
  <label for="gc-msg">Mensaje en la gift card (opcional)<input id="gc-msg" data-f="mensaje" value="${esc(F.mensaje)}" placeholder="Ej. ¡Feliz cumpleaños! Te mereces un día de regaloneo"></label>
  <div class="row"><span class="muted" style="font-size:13px;font-weight:600">Pagó con:</span><div class="chips">${MEDIOS.map(([k,l])=>`<button class="chip" data-act="medio" data-k="${k}" aria-pressed="${F.medio===k}">${l}</button>`).join("")}</div></div>
  <div class="fields">${F.medio==="tarjeta"?`<label for="gc-op">N° de operación del voucher<input id="gc-op" class="m" data-f="op" value="${esc(F.op)}" inputmode="numeric"></label>`:""}<label for="gc-fecha">Fecha de la venta<input id="gc-fecha" type="date" max="${hoy()}" data-f="fecha" value="${esc(F.fecha)}"></label></div>
  ${emp&&F.medio!=="tarjeta"?`<div class="note info">Las empresas suelen pedir factura. Avísale a Surtax para emitirla a nombre de la empresa.</div>`:""}
  <div class="row"><b style="font-size:18px">Total: ${clp(u*n)}</b><button class="btn" data-act="vender" ${S.saving?"disabled":""}>${S.saving?"Guardando…":"Registrar venta"}</button></div></div>`}
function vResumen(){const L=S.list.filter(g=>g.estado!=="anulada");const vend=L.reduce((a,g)=>a+int(g.valor),0),saldo=L.reduce((a,g)=>a+int(g.saldo),0);
  return`<div class="kpis"><div class="kpi"><span>Gift cards vendidas</span><b>${L.length}</b></div><div class="kpi"><span>Monto vendido</span><b>${clp(vend)}</b></div><div class="kpi"><span>Ya canjeado</span><b>${clp(vend-saldo)}</b></div><div class="kpi"><span>Por atender (saldo vigente)</span><b>${clp(saldo)}</b></div></div>`}
function vLista(){const L=S.list.filter(g=>(!S.filtro||g.estado===S.filtro)&&(!S.q||(g.id+" "+(g.para||"")+" "+(g.de||"")+" "+(g.empresa||"")).toLowerCase().includes(S.q.toLowerCase())));
  return`<div class="panel"><div class="row" style="justify-content:space-between"><div class="chips">${[["vigente","Vigentes"],["canjeada","Canjeadas"],["anulada","Anuladas"],["","Todas"]].map(([k,l])=>`<button class="chip" data-act="filtro" data-k="${k}" aria-pressed="${S.filtro===k}">${l}</button>`).join("")}</div>
  <div class="row"><input id="gc-q" value="${esc(S.q)}" placeholder="Buscar código, nombre o empresa" style="min-width:220px"><button class="btn sec" data-act="excel">Excel</button></div></div>
  ${L.length?`<div class="tbl"><table><thead><tr><th>Código</th><th>Incluye</th><th>Para / Empresa</th><th>Vendida</th><th class="n">Valor</th><th class="n">Saldo</th><th>Estado</th><th></th></tr></thead><tbody>
  ${L.map(g=>{const e=EST[g.estado]||[g.estado,"n"];return`<tr><td class="m"><b>${esc(g.id)}</b></td><td>${esc(g.descripcion)}</td><td>${esc(g.para||"—")}${g.empresa?`<br><span class="muted" style="font-size:12px">${esc(g.empresa)}</span>`:""}</td><td class="m">${esc(g.fechaVenta)}</td><td class="n">${clp(g.valor)}</td><td class="n">${clp(g.saldo)}</td><td><span class="pill ${e[1]}">${e[0]}</span></td><td><button class="mini" data-act="ver" data-id="${esc(g.id)}">Ver</button></td></tr>`}).join("")}</tbody></table></div>`:`<div class="empty">No hay gift cards en esta vista.</div>`}</div>`}
function vDet(){const g=S.list.find(x=>x.id===S.sel);if(!g)return`<div class="empty">No encontrada. <button class="mini" data-act="volver">Volver</button></div>`;const e=EST[g.estado]||[g.estado,"n"];const local=S.cfg.local||"NÚASPA";
  const txt=`¡Hola${g.para?" "+String(g.para).split(" ")[0]:""}! 🎁 Te regalaron una gift card de ${local}${g.de?" de parte de "+g.de:""}: ${g.descripcion}. Tu código es ${g.id}. Agenda tu hora y presenta el código al llegar 💅`;
  return`<div class="row" style="justify-content:space-between"><button class="btn sec" data-act="volver">← Volver</button><span class="pill ${e[1]}">${e[0]}</span></div>
  <h1 class="m">${esc(g.id)}</h1>
  <div class="panel"><div class="fields">
    <label for="d-para">Para<input id="d-para" value="${esc(g.para||"")}"></label><label for="d-de">De<input id="d-de" value="${esc(g.de||"")}"></label>
    <label for="d-msg" style="grid-column:span 2">Mensaje<input id="d-msg" value="${esc(g.mensaje||"")}"></label></div>
    <div class="row"><button class="mini" data-act="guardar-datos">Guardar nombre y mensaje</button></div>
    <p class="muted" style="margin:0;font-size:14px">${esc(g.descripcion)} · Valor ${clp(g.valor)} · Saldo <b>${clp(g.saldo)}</b> · Vendida el ${esc(g.fechaVenta)} con ${esc((MEDIOS.find(m=>m[0]===g.medioVenta)||["",g.medioVenta])[1])}${g.opVenta?" (op. "+esc(g.opVenta)+")":""}${g.empresa?` · Empresa: ${esc(g.empresa)} ${esc(g.rutEmpresa||"")}`:""}</p></div>
  <div class="panel"><h2>Tarjeta para enviar</h2>${S.img?`<img class="prev" src="${S.img}" alt="Gift card">`:""}
    <div class="row"><button class="btn" data-act="png">Descargar imagen</button><a class="mini wsp" target="_blank" rel="noopener" href="${esc(wsp(g.telefono,txt))}">Enviar por WhatsApp</a></div>
    <p class="muted" style="margin:0;font-size:13px">Descarga la imagen y adjúntala en WhatsApp junto al mensaje.</p></div>
  <div class="panel"><h2>Canjes</h2>${(g.canjes||[]).length?`<div class="tbl"><table style="min-width:420px"><thead><tr><th>Fecha</th><th>Profesional</th><th class="n">Monto</th></tr></thead><tbody>${g.canjes.map(c=>`<tr><td class="m">${esc(c.fecha)}</td><td>${esc(c.prof||"")}${c.nota?` <span class="muted">· ${esc(c.nota)}</span>`:""}</td><td class="n">${clp(c.monto)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted" style="margin:0">Aún no se ha usado.</p>`}
    ${(g.ajustes||[]).length?`<p class="muted" style="margin:0;font-size:13px"><b>Ajustes:</b> ${g.ajustes.map(j=>`${esc(String(j.fecha).slice(0,10))} de ${clp(j.de)} a ${clp(j.a)}${j.motivo?" ("+esc(j.motivo)+")":""}`).join(" · ")}</p>`:""}
    ${g.estado==="anulada"?`<p class="muted" style="margin:0;font-size:13px"><b>Anulada</b> ${esc(String(g.anulada||"").slice(0,10))}${g.motivoAnulacion?": "+esc(g.motivoAnulacion):""}</p>`:""}
    <div class="row"><label for="d-saldo" style="max-width:200px">Ajustar saldo<input id="d-saldo" class="m" inputmode="numeric" value="${int(g.saldo)}"></label><label for="d-motivo" style="flex:1;min-width:200px">Motivo (obligatorio)<input id="d-motivo" placeholder="Ej. devolución a la clienta"></label></div>
    <div class="row"><button class="mini" data-act="saldo">Guardar saldo</button>${g.estado!=="anulada"?`<button class="mini" data-act="anular">Anular gift card</button>`:""}</div>
    <p class="muted" style="margin:0;font-size:13px">Si se anula un servicio pagado con esta gift card, el saldo vuelve solo. Ajusta a mano solo casos especiales. Las gift cards no se borran: se anulan y queda el registro.</p></div>`}
function dibujar(g){const cv=document.createElement("canvas");cv.width=1080;cv.height=640;const x=cv.getContext("2d");
  const gr=x.createLinearGradient(0,0,1080,640);gr.addColorStop(0,"#5b2a6e");gr.addColorStop(1,"#16325c");x.fillStyle=gr;x.fillRect(0,0,1080,640);
  x.strokeStyle="rgba(255,255,255,.35)";x.lineWidth=3;x.strokeRect(30,30,1020,580);
  x.fillStyle="#fff";x.font="700 64px Georgia,serif";x.fillText(S.cfg.local||"NÚASPA",70,130);
  x.font="600 30px system-ui,Arial";x.fillStyle="rgba(255,255,255,.85)";x.fillText("GIFT CARD",72,180);
  x.fillStyle="#fff";x.font="700 46px system-ui,Arial";const d=String(g.descripcion);x.fillText(d.length>38?d.slice(0,37)+"…":d,70,280);
  x.font="400 30px system-ui,Arial";if(g.para)x.fillText("Para: "+g.para,70,350);if(g.de)x.fillText("De: "+g.de,70,395);
  if(g.mensaje){x.font="italic 28px Georgia,serif";x.fillStyle="rgba(255,255,255,.9)";const m=String(g.mensaje);x.fillText("“"+(m.length>60?m.slice(0,59)+"…":m)+"”",70,455)}
  x.fillStyle="#fff";x.fillRect(70,500,420,80);x.fillStyle="#16325c";x.font="700 44px ui-monospace,Menlo,monospace";x.fillText(g.id,95,556);
  x.fillStyle="rgba(255,255,255,.85)";x.font="400 22px system-ui,Arial";x.fillText("Presenta este código al llegar. Sin vencimiento.",530,535);x.fillText(S.cfg.direccion||"",530,568);
  return cv.toDataURL("image/png")}
async function nuevoCodigo(){const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789";for(let i=0;i<20;i++){let c="NUA-";for(let j=0;j<4;j++)c+=A[Math.floor(Math.random()*A.length)];const s=await S.db.doc("giftcards/"+c).get();if(!s.exists)return c}throw new Error("sin código")}
async function vender(){const F=S.F,emp=F.tipo==="empresa",u=valorUnit(F),n=emp?Math.max(1,int(F.cantidad)||1):1;
  if(!u){toast(F.modo==="servicio"?"Elige el servicio":"Indica el monto");return}if(emp&&!F.empresa.trim()){toast("Indica la empresa");return}if(n>200){toast("Máximo 200 por venta");return}
  const s=S.servs.find(x=>x.id===F.servId);const desc=F.modo==="servicio"?(s?s.nombre:"Servicio"):"Monto "+clp(u);
  S.saving=true;render();const now=new Date();const lote=emp?"L"+now.getTime():"";const creados=[];
  try{for(let i=0;i<n;i++){const id=await nuevoCodigo();await S.db.doc("giftcards/"+id).set({tipo:F.tipo,modo:F.modo,servId:F.modo==="servicio"?F.servId:"",descripcion:desc,valor:u,saldo:u,para:emp?"":F.para.trim(),de:emp?F.empresa.trim():F.de.trim(),telefono:F.telefono.trim(),mensaje:F.mensaje.trim(),
      empresa:emp?F.empresa.trim():"",rutEmpresa:emp?F.rutEmpresa.trim():"",contacto:emp?F.contacto.trim():"",lote,fechaVenta:F.fecha,horaVenta:now.toTimeString().slice(0,5),medioVenta:F.medio,opVenta:F.medio==="tarjeta"?F.op.trim():"",
      valorVenta:u,estado:"vigente",canjes:[],creado:now.toISOString(),por:S.email});creados.push(id)}
    toast(n>1?`${n} gift cards creadas`:`Gift card ${creados[0]} creada`);S.F=vacio();if(n===1){S.sel=creados[0]}}
  catch(e){console.warn(e);toast("No se pudo registrar la venta"+(creados.length?` (se crearon ${creados.length})`:""))}
  S.saving=false;render();if(S.sel){const g=S.list.find(x=>x.id===S.sel);if(g){S.img=dibujar(g);render()}}}
function excel(){if(!window.XLSX)return;const rows=S.list.map(g=>({"Código":g.id,Tipo:g.tipo==="empresa"?"Empresa":"Persona",Incluye:g.descripcion,Valor:g.valor,Saldo:g.saldo,Estado:g.estado,Para:g.para||"",De:g.de||"",Empresa:g.empresa||"","RUT empresa":g.rutEmpresa||"","Fecha venta":g.fechaVenta,"Medio venta":g.medioVenta,"N° operación":g.opVenta||"",Canjes:(g.canjes||[]).map(c=>c.fecha+" "+c.prof+" "+c.monto).join("; ")}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),"Gift cards");XLSX.writeFile(wb,"Gift cards NÚASPA "+hoy()+".xlsx")}
document.addEventListener("input",ev=>{const t=ev.target;if(t.dataset.f){S.F[t.dataset.f]=t.value;if(["monto","cantidad"].includes(t.dataset.f))render();return}if(t.id==="gc-q"){S.q=t.value;render()}});
document.addEventListener("change",ev=>{const t=ev.target;if(t.dataset.f){S.F[t.dataset.f]=t.value;if(t.tagName==="SELECT"||t.type==="date")render()}});
document.addEventListener("click",async ev=>{const a=ev.target.closest("[data-act]");if(!a)return;const k=a.dataset.act;
  if(k==="tipo"){S.F.tipo=a.dataset.k;render();return}if(k==="modo"){S.F.modo=a.dataset.k;render();return}if(k==="medio"){S.F.medio=a.dataset.k;render();return}
  if(k==="filtro"){S.filtro=a.dataset.k;render();return}if(k==="vender"){vender();return}if(k==="excel"){excel();return}
  if(k==="ver"){S.sel=a.dataset.id;const g=S.list.find(x=>x.id===S.sel);S.img=g?dibujar(g):null;render();window.scrollTo(0,0);return}
  if(k==="volver"){S.sel=null;S.img=null;render();return}
  const g=S.list.find(x=>x.id===S.sel);if(!g)return;
  if(k==="png"){const l=document.createElement("a");l.href=S.img||dibujar(g);l.download="Gift card "+g.id+".png";document.body.appendChild(l);l.click();l.remove();return}
  if(k==="guardar-datos"){try{await S.db.doc("giftcards/"+g.id).update({para:$("#d-para").value.trim(),de:$("#d-de").value.trim(),mensaje:$("#d-msg").value.trim()});toast("Guardado");setTimeout(()=>{const x=S.list.find(y=>y.id===S.sel);if(x){S.img=dibujar(x);render()}},400)}catch(e){toast("No se pudo guardar")}return}
  const motivo=($("#d-motivo")||{}).value?$("#d-motivo").value.trim():"";
  const yaCerrado=async()=>{try{return(await S.db.doc("cierres/"+g.fechaVenta).get()).exists}catch(e){return false}};
  if((k==="saldo"||k==="anular")&&!motivo){toast("Escribe el motivo");return}
  if(k==="saldo"){const v=int($("#d-saldo").value);if(v<0||v>int(g.valor)){toast("El saldo debe estar entre $0 y el valor de la gift card");return}try{await S.db.doc("giftcards/"+g.id).update({saldo:v,estado:v===0?"canjeada":"vigente",ajustes:(g.ajustes||[]).concat([{fecha:new Date().toISOString(),de:g.saldo,a:v,por:S.email,motivo}])});toast("Saldo actualizado")}catch(e){toast("No se pudo actualizar")}return}
  if(k==="anular"){if(a.dataset.ok!=="1"){a.dataset.ok="1";a.textContent="¿Seguro? Toca de nuevo";setTimeout(()=>{a.dataset.ok="";a.textContent="Anular gift card"},3000);return}try{const cer=await yaCerrado();await S.db.doc("giftcards/"+g.id).update({estado:"anulada",anulada:new Date().toISOString(),motivoAnulacion:motivo,anuladaPor:S.email});toast(cer?"Gift card anulada. Ojo: la caja del "+g.fechaVenta+" ya estaba cerrada; actualiza ese cierre (si devolviste el dinero, regístralo como egreso)":"Gift card anulada")}catch(e){toast("No se pudo anular")}}});
init();
})();
</script></body></html>

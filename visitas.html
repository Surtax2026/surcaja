<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Visitantes de las demos · Surtax</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=PT+Sans:wght@400;700&display=swap">
<style>
:root{--navy:#06213C;--gold:#A98A54;--gold-t:#956A32;--bg:#F5F3EE;--card:#fff;--fg:#132338;--muted:#5b6472;--line:#ddd6c8;--ok:#2E6B4F;--ok-s:#e3f1ea;--am:#9a5b0e;--am-s:#fbefdc}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "PT Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
.top{background:var(--navy);color:#fff;border-bottom:3px solid var(--gold)}
.wrap{max-width:1150px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.top h1{font:600 22px "Playfair Display",Georgia,serif;margin:0}
.top small{color:#C19257;letter-spacing:2px;text-transform:uppercase;font-size:11px;font-weight:700}
main .wrap{padding-block:22px 60px;display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);padding:12px 14px}
.kpi span{font-size:12px;color:var(--muted);font-weight:700}.kpi b{display:block;font-size:24px}
.filt{display:flex;flex-wrap:wrap;gap:8px}
.filt button{font:700 13px "PT Sans",sans-serif;border:1px solid var(--line);background:var(--card);padding:6px 12px;cursor:pointer;color:var(--fg)}
.filt button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.list{display:grid;gap:10px}
.lead{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);padding:14px 16px;display:grid;grid-template-columns:1.3fr 1fr auto;gap:10px 18px;align-items:start}
.lead.c{border-left-color:var(--ok)}
@media(max-width:820px){.lead{grid-template-columns:1fr}}
.lead h3{margin:0;font-size:17px}.lead .m{color:var(--muted);font-size:13.5px}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;margin-right:4px}
.pill.caja{background:#efe6d6;color:var(--gold-t)}.pill.arr{background:#e6ecf5;color:var(--navy)}.pill.ok{background:var(--ok-s);color:var(--ok)}.pill.nuevo{background:var(--am-s);color:var(--am)}
.act{font-size:13.5px}.act ul{margin:4px 0 0;padding-left:18px}
.btns{display:grid;gap:6px;justify-items:stretch;min-width:170px}
.btns a,.btns button{font:700 14px "PT Sans",sans-serif;text-align:center;text-decoration:none;padding:9px 12px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.btns a.wa{background:#1f8a4c;border-color:#1f8a4c;color:#fff}
.empty{border:1.5px dashed var(--line);padding:26px;text-align:center;color:var(--muted)}
.note{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div><small>Surtax · privado</small><h1>Visitantes de las demos</h1></div><span id="who" class="note" style="color:#cfd6e0"></span></div></header>
<main><div class="wrap" id="app"><div class="empty">Cargando…</div></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script src="adapter.js"></script>
<script>
(function(){
"use strict";
const S={leads:[],ev:{},f:"todos"};
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fecha=t=>{const d=t&&t.toDate?t.toDate():new Date(t);return isNaN(d)?"—":d.toLocaleString("es-CL",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})};
const NOMBRES={agenda:"Agenda",registrar:"Registrar",hoy:"Día",cierre:"Cierre de caja",liquidacion:"Liquidación",reportes:"Reportes",clientas:"Clientas",ajustes:"Ajustes",
  cobranza:"Cobranza",contratos:"Contratos",facturacion:"Facturación",rendicion:"Rendición",propiedades:"Propiedades",mercadopago:"Cobro con la máquina",whatsapp:"Mensajes de WhatsApp",
  "cta-whatsapp":"Tocó «Quiero…»","aviso-arrendatario":"Avisos a arrendatarios",descarga:"Descargas",guardar:"Guardó datos de prueba",reiniciar:"Reinició la demo",entrada:"Entró",vuelve:"Volvió"};
function resumen(id){const evs=S.ev[id]||[];let seg=0;const c={};evs.forEach(e=>{seg+=Number(e.segundos)||0;const a=e.acciones||{};Object.keys(a).forEach(k=>{const n=k.replace(/^(ver|accion|clic|rol):/,"");c[n]=(c[n]||0)+(Number(a[k])||0)})});
  const top=Object.entries(c).filter(([k])=>NOMBRES[k]).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([k,n])=>NOMBRES[k]+" ("+n+")");return{seg,top,visitas:evs.length,cta:!!c["cta-whatsapp"]}}
function msg(l){const n=String(l.nombre||"").split(" ")[0];
  return l.demo==="surarriendos"
    ?`Hola ${n}, soy Jorge Sandoval, de Surtax. Vi que probaste la demo de SurArriendos. ¿Te parece si conversamos cómo administraríamos tu propiedad? Te puedo preparar una revisión de tu arriendo frente al mercado.`
    :`Hola ${n}, soy Jorge Sandoval, de Surtax. Vi que probaste la demo de SurCaja${l.negocio?" para "+l.negocio:""}. ¿Te muestro cómo quedaría con tus servicios y tu equipo? Podemos partir con un piloto de 2 a 3 meses.`}
function render(){
  const L=S.leads.filter(l=>S.f==="todos"||(S.f==="pend"?!l.contactado:S.f===l.demo));
  const k=(f)=>S.leads.filter(f).length;
  document.getElementById("app").innerHTML=`<div class="kpis"><div class="kpi"><span>Visitantes</span><b>${S.leads.length}</b></div><div class="kpi"><span>SurCaja</span><b>${k(l=>l.demo==="surcaja")}</b></div><div class="kpi"><span>SurArriendos</span><b>${k(l=>l.demo==="surarriendos")}</b></div><div class="kpi"><span>Por contactar</span><b>${k(l=>!l.contactado)}</b></div></div>
  <div class="filt">${[["todos","Todos"],["pend","Por contactar"],["surcaja","SurCaja"],["surarriendos","SurArriendos"]].map(([v,t])=>`<button data-f="${v}" aria-pressed="${S.f===v}">${t}</button>`).join("")}</div>
  <div class="list">${L.length?L.map(l=>{const r=resumen(l.id);const wa="https://wa.me/"+String(l.whatsapp||"").replace(/\D/g,"")+"?text="+encodeURIComponent(msg(l));
    return `<div class="lead ${l.contactado?"c":""}"><div><h3>${esc(l.nombre)}</h3><div class="m">${l.demo==="surarriendos"?`<span class="pill arr">SurArriendos</span>${esc(l.propiedades||"")} propiedad(es)`:`<span class="pill caja">SurCaja</span>${esc(l.negocio||"")}${l.rubro?" · "+esc(l.rubro):""}`} · ${esc(l.comuna||"")}</div>
      <div class="m">${esc(l.whatsapp||"")} · entró el ${fecha(l.creado)} · llegó desde ${esc(l.origen||"—")}</div>
      ${l.contactado?`<div class="m"><span class="pill ok">Contactado</span>${fecha(l.contactado)}</div>`:`<span class="pill nuevo">Por contactar</span>`}</div>
      <div class="act"><b>${Math.round(r.seg/60)} min</b> de uso${r.cta?" · <b>tocó «Quiero»</b>":""}${r.top.length?`<ul>${r.top.map(t=>`<li>${esc(t)}</li>`).join("")}</ul>`:`<div class="m">Aún sin actividad registrada.</div>`}</div>
      <div class="btns"><a class="wa" href="${esc(wa)}" target="_blank" rel="noopener" data-c="${esc(l.id)}">Escribir por WhatsApp</a><button data-x="${esc(l.id)}">${l.contactado?"Marcar por contactar":"Marcar contactado"}</button></div></div>`}).join(""):`<div class="empty">Todavía no hay visitantes en este filtro.</div>`}</div>
  <p class="note">Solo Surtax ve esta página. Cada visitante aceptó ser contactado por WhatsApp. Si alguien pide que borren sus datos, avísale a Claude o bórralo en la consola de Firebase (colección «leads»).</p>`;
}
document.addEventListener("click",async e=>{const f=e.target.closest("[data-f]");if(f){S.f=f.dataset.f;render();return}
  const x=e.target.closest("[data-x]");if(x){const l=S.leads.find(y=>y.id===x.dataset.x);await S.db.doc("leads/"+l.id).update({contactado:l.contactado?firebase.firestore.FieldValue.delete():new Date().toISOString()});return}
  const c=e.target.closest("[data-c]");if(c){const l=S.leads.find(y=>y.id===c.dataset.c);if(l&&!l.contactado)S.db.doc("leads/"+l.id).update({contactado:new Date().toISOString()}).catch(()=>{})}});
window.claude.use("db").then(db=>{S.db=db;const u=firebase.auth().currentUser;document.getElementById("who").textContent=u?u.email:"";
  db.collection("leads").orderBy("creado","desc").onSnapshot(q=>{S.leads=q.docs.map(d=>({id:d.id,...d.data()}));render();
    S.leads.forEach(l=>{if(S.ev[l.id+"_sub"])return;S.ev[l.id+"_sub"]=1;db.collection("leads/"+l.id+"/eventos").onSnapshot(q2=>{S.ev[l.id]=q2.docs.map(d=>d.data());render()},()=>{})})},
  err=>{document.getElementById("app").innerHTML=`<div class="empty"><b>No tienes acceso a esta página.</b><br>Solo las cuentas de Surtax pueden ver los visitantes.</div>`})});
})();
</script>
</body>
</html>

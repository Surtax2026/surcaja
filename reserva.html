<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reserva tu hora · NÚASPA</title>
<meta name="description" content="Reserva tu hora en NÚASPA: manicure, pedicure, pestañas, cejas y depilación. Av. Cristóbal Colón 6555, local 9, Las Condes.">
<meta name="theme-color" content="#F7F1EA">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Jost:wght@300;400;500;600&display=swap">
<style>
:root{--bg:#F7F1EA;--card:#FFFFFF;--ink:#4E3D2B;--muted:#8A7660;--gold:#A9864A;--gold-d:#8A6A33;--line:#E6D9C6;--soft:#F1E6D6;--ok:#2F6B4F;--err:#A3312F;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Jost,"Segoe UI",Arial,sans-serif}
body{padding:0 max(16px,env(safe-area-inset-left)) 48px max(16px,env(safe-area-inset-right))}
.wrap{max-width:640px;margin:0 auto;display:grid;gap:18px}
header{text-align:center;padding:28px 0 6px;display:grid;justify-items:center;gap:8px}
.logo{font:400 clamp(40px,11vw,56px)/1 "Bodoni Moda",Georgia,serif;letter-spacing:.12em;color:var(--gold);display:grid;justify-items:center;gap:2px}
.logo-img{display:block;width:min(300px,78vw);height:auto}
.logo .lotus{font-size:.5em;letter-spacing:0;color:#D9B98A}
header p{margin:0;color:var(--muted);font-size:14px;letter-spacing:.04em}
h1{font:400 clamp(30px,7vw,40px)/1.1 "Bodoni Moda",Georgia,serif;margin:6px 0 0;text-align:center}
h2{font:600 13px/1.3 Jost,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-d);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:14px}
.steps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.steps span{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.steps span.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.cats button{flex:0 0 auto}
button{font:500 15px Jost,sans-serif;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;min-height:44px}
button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
.svc{display:grid;gap:8px}
.svc button{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;padding:12px 14px}
.svc button small{grid-column:1;color:var(--muted);font-size:13px}
.svc button[aria-pressed="true"] small{color:#E9DCC8}
.svc button b{grid-column:2;grid-row:1/span 2;align-self:center;font-weight:600}
.pros,.days,.hours{display:flex;flex-wrap:wrap;gap:8px}
.days{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.days button{flex:0 0 auto;display:grid;justify-items:center;line-height:1.15;padding:8px 12px;min-width:62px}
.days small{font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.days b{font-size:20px;font-weight:500}
.hours button{min-width:76px;font-variant-numeric:tabular-nums}
.sum{display:flex;justify-content:space-between;gap:12px;align-items:baseline;border-top:1px dashed var(--line);padding-top:12px;font-size:15px}
.sum b{font:600 20px Jost,sans-serif}
label{display:grid;gap:6px;font-size:14px;font-weight:500}
input,textarea{font:16px Jost,sans-serif;padding:12px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);width:100%}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.cta{background:var(--gold);border-color:var(--gold);color:#fff;font-weight:600;font-size:17px;padding:14px;width:100%}
.cta:hover:not(:disabled){background:var(--gold-d)}
.link{background:none;border:0;color:var(--gold-d);text-decoration:underline;padding:4px 0;min-height:0;font-size:14px}
.muted{color:var(--muted);font-size:14px;margin:0}
.msg{border-radius:12px;padding:12px 14px;font-size:14px;margin:0}
.msg.err{background:#F8E3E2;color:var(--err)}
.msg.info{background:var(--soft)}
.done{text-align:center;justify-items:center}
.done .ico{width:64px;height:64px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-size:30px;color:var(--gold-d)}
.wsp{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:#1F7A4D;border-color:#1F7A4D;color:#fff;text-decoration:none;border-radius:12px;padding:12px 16px;font-weight:600}
footer{text-align:center;color:var(--muted);font-size:13px;display:grid;gap:4px;padding-top:6px}
footer a{color:var(--gold-d)}
.skel{height:44px;border-radius:12px;background:linear-gradient(90deg,#efe5d6,#f7efe4,#efe5d6);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.pl{display:grid;gap:4px}
.pl h2{margin-top:6px}
.pl .row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.pl .row:last-child{border-bottom:0}
.pl .row small{grid-column:1;color:var(--muted);font-size:13px}
.pl .row b{grid-column:2;grid-row:1/span 2;align-self:center;font-weight:600;font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo-img" src="logo-nua.png" alt="NÚASPA" width="917" height="240">
    <p>Manicure · Pedicure · Pestañas · Cejas · Depilación</p>
    <h1>Reserva tu hora</h1>
  </header>
  <main id="app" aria-live="polite"><div class="card"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></main>
  <footer id="foot"></footer>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
"use strict";
firebase.initializeApp(window.SURCAJA_FIREBASE);
const db=firebase.firestore();
const PASO=30,ANTICIPO_MIN=90,DIAS=21;
const R={precios:new URLSearchParams(location.search).get("v")==="precios",cat:null,step:1,items:[],pro:"",fecha:"",hora:"",ocup:{},cargandoDia:false,nombre:"",tel:"",mail:"",waOk:false,nota:"",enviando:false,error:"",hecho:null,catSel:""};
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clp=n=>"$"+Math.round(Number(n)||0).toLocaleString("es-CL");
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const toMin=h=>{const m=String(h||"").match(/^(\d{1,2}):(\d{2})/);return m?+m[1]*60+ +m[2]:0};
const fromMin=n=>String(Math.floor(n/60)).padStart(2,"0")+":"+String(n%60).padStart(2,"0");
const fLarga=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("es-CL",{weekday:"long",day:"numeric",month:"long"})};
function telNorm(t){let d=String(t||"").replace(/\D/g,"");if(d.startsWith("56"))return d;if(d.length===9&&d[0]==="9")return"56"+d;if(d.length===8)return"569"+d;return d}

async function init(){
  try{const s=await db.doc("publico/catalogo").get();if(!s.exists)throw new Error("sin catálogo");R.cat=s.data()}
  catch(e){$("#app").innerHTML=`<div class="card"><p class="msg err">La reserva en línea no está disponible en este momento. Escríbenos por WhatsApp o Instagram y te agendamos.</p></div>`;return}
  const c=R.cat;R.catSel=(cats()[0]||"");
  const w=telNorm(c.whatsapp);
  $("#foot").innerHTML=`<span>${esc(c.direccion||"")}</span>${w?`<span>WhatsApp <a href="https://wa.me/${w}">+${w.replace(/^56(9)(\d{4})(\d{4})$/,"56 $1 $2 $3")}</a>${c.instagram?` · <a href="https://instagram.com/${esc(c.instagram)}">@${esc(c.instagram)}</a>`:""}</span>`:""}`;
  render();
}
function cats(){const o=[];(R.cat.servicios||[]).forEach(s=>{if(!o.includes(s.categoria))o.push(s.categoria)});return o}
function sel(){return R.items.map(id=>(R.cat.servicios||[]).find(s=>s.id===id)).filter(Boolean)}
function dur(){return sel().reduce((a,s)=>a+(Number(s.duracion)||60),0)}
function total(){return sel().reduce((a,s)=>a+(Number(s.precio)||0),0)}
function abierto(f){const[y,m,d]=f.split("-").map(Number);const dow=new Date(y,m-1,d).getDay();return!(R.cat.cerrados||[]).includes(dow)}
function dias(){const o=[];const t=new Date();for(let i=0;o.length<DIAS&&i<DIAS+10;i++){const d=new Date(t.getFullYear(),t.getMonth(),t.getDate()+i);const f=ymd(d);if(abierto(f))o.push(f)}return o}
function horDe(p,f){const[yy,mm,dd]=f.split("-").map(Number);const dw=new Date(yy,mm-1,dd).getDay();
  if(p&&p.horario){const h=p.horario[String(dw)];return h&&h.a&&h.b?{a:toMin(h.a),b:toMin(h.b)}:null}
  return{a:toMin(R.cat.abre||"10:00"),b:toMin((dw===6&&R.cat.cierraSab)||R.cat.cierra||"20:00")}}
function libres(f){
  const D=dur();const P=(R.cat.profesionales||[]).filter(p=>!R.pro||p.id===R.pro);
  const ocup=R.ocup[f]||[];const now=new Date();const min=f===ymd(now)?now.getHours()*60+now.getMinutes()+ANTICIPO_MIN:0;
  const hs=P.map(p=>({p:p.id,h:horDe(p,f)})).filter(x=>x.h);if(!hs.length)return[];
  const a=Math.min(...hs.map(x=>x.h.a)),b=Math.max(...hs.map(x=>x.h.b));
  const out=[];
  for(let m=a;m+D<=b;m+=PASO){if(m<min)continue;
    const ok=hs.some(({p,h})=>m>=h.a&&m+D<=h.b&&!ocup.some(x=>x.p===p&&toMin(x.h)<m+D&&toMin(x.h)+(+x.d||0)>m));
    if(ok)out.push(fromMin(m))}
  return out}
async function cargarDia(f){
  if(R.ocup[f])return;R.cargandoDia=true;render();
  try{const s=await db.doc("ocupado/"+f).get();R.ocup[f]=s.exists?(s.data().slots||[]):[]}catch(e){R.ocup[f]=[]}
  R.cargandoDia=false;render()}

function pasos(){const n=["Servicios","Profesional y hora","Tus datos"];return`<div class="steps">${n.map((t,i)=>`<span class="${R.step===i+1?"on":""}">${i+1}. ${t}</span>`).join("")}</div>`}
function vServicios(){const C=cats(),lista=(R.cat.servicios||[]).filter(s=>s.categoria===R.catSel);
  return`<div class="card"><h2>¿Qué te quieres hacer?</h2>
  <div class="cats" role="group" aria-label="Categorías">${C.map(c=>`<button data-a="cat" data-v="${esc(c)}" aria-pressed="${c===R.catSel}">${esc(c)}</button>`).join("")}</div>
  <div class="svc">${lista.map(s=>`<button data-a="svc" data-v="${esc(s.id)}" aria-pressed="${R.items.includes(s.id)}"><span>${esc(s.nombre)}</span><small>${Number(s.duracion)||60} min</small><b>${clp(s.precio)}</b></button>`).join("")}</div>
  ${R.items.length?`<div class="sum"><span>${R.items.length} servicio${R.items.length>1?"s":""} · ${dur()} min aprox.</span><b>${clp(total())}</b></div>`:`<p class="muted">Puedes elegir más de uno.</p>`}
  <button class="cta" data-a="paso" data-v="2" ${R.items.length?"":"disabled"}>Continuar</button></div>`}
function vHora(){const P=R.cat.profesionales||[],D=dias();if(!R.fecha)R.fecha=D[0]||"";
  if(R.fecha&&!R.ocup[R.fecha]&&!R.cargandoDia)setTimeout(()=>cargarDia(R.fecha));
  const H=R.ocup[R.fecha]?libres(R.fecha):null;
  return`<div class="card"><h2>¿Con quién?</h2>
  <div class="pros"><button data-a="pro" data-v="" aria-pressed="${!R.pro}">Cualquiera</button>${P.map(p=>`<button data-a="pro" data-v="${esc(p.id)}" aria-pressed="${R.pro===p.id}">${esc(p.nombre)}</button>`).join("")}</div>
  <h2>¿Qué día?</h2>
  <div class="days">${D.map(f=>{const[y,m,d]=f.split("-").map(Number);const dt=new Date(y,m-1,d);return`<button data-a="dia" data-v="${f}" aria-pressed="${f===R.fecha}"><small>${dt.toLocaleDateString("es-CL",{weekday:"short"})}</small><b>${d}</b><small>${dt.toLocaleDateString("es-CL",{month:"short"})}</small></button>`}).join("")}</div>
  <h2>¿A qué hora? <span style="text-transform:none;letter-spacing:0;color:var(--muted);font-weight:400">${R.fecha?esc(fLarga(R.fecha)):""}</span></h2>
  ${H===null?`<div class="skel"></div>`:H.length?`<div class="hours">${H.map(h=>`<button data-a="hora" data-v="${h}" aria-pressed="${R.hora===h}">${h}</button>`).join("")}</div>`:`<p class="msg info">No quedan horas para ${R.pro?"esta profesional":"ese día"}. Prueba otro día${R.pro?" o elige “Cualquiera”":""}.</p>`}
  <div class="sum"><span>${esc(sel().map(s=>s.nombre).join(", "))}</span><b>${clp(total())}</b></div>
  <button class="cta" data-a="paso" data-v="3" ${R.hora?"":"disabled"}>Continuar</button>
  <button class="link" data-a="paso" data-v="1">← Cambiar servicios</button></div>`}
function vDatos(){const pro=(R.cat.profesionales||[]).find(p=>p.id===R.pro);
  return`<div class="card"><h2>Tus datos</h2>
  <p class="msg info"><b>${esc(fLarga(R.fecha))}, ${esc(R.hora)}</b>${pro?` con ${esc(pro.nombre)}`:""}<br>${esc(sel().map(s=>s.nombre).join(", "))} · ${clp(total())}</p>
  <label for="r-nom">Nombre y apellido<input id="r-nom" autocomplete="name" value="${esc(R.nombre)}" maxlength="80"></label>
  <label for="r-tel">WhatsApp<input id="r-tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="9 1234 5678" value="${esc(R.tel)}" maxlength="20"></label>
  <label for="r-mail">Correo (opcional, para recibir la confirmación)<input id="r-mail" type="email" inputmode="email" autocomplete="email" placeholder="tucorreo@ejemplo.cl" value="${esc(R.mail)}" maxlength="80"></label>
  <label style="display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px"><input id="r-wa" type="checkbox" style="width:20px;height:20px;margin-top:2px;flex:0 0 auto" ${R.waOk?"checked":""}><span>Acepto recibir por WhatsApp la confirmación y el recordatorio de mi hora.</span></label>
  <label for="r-nota">Comentario (opcional)<textarea id="r-nota" rows="2" maxlength="300" placeholder="Ej. es para dos personas, tengo uñas acrílicas de otro salón">${esc(R.nota)}</textarea></label>
  ${R.error?`<p class="msg err">${esc(R.error)}</p>`:""}
  <button class="cta" data-a="enviar" ${R.enviando?"disabled":""}>${R.enviando?"Enviando…":"Solicitar hora"}</button>
  <p class="muted" style="font-size:12.5px">Te enviamos la confirmación al correo que dejes y, si lo aceptas, por WhatsApp. Si no puedes asistir, avísanos con al menos 3 horas de anticipación. Usamos tu nombre, teléfono y correo solo para gestionar tu reserva en NÚASPA (LUZIA SpA); puedes pedir que los eliminemos escribiéndonos.</p>
  <button class="link" data-a="paso" data-v="2">← Cambiar día u hora</button></div>`}
function vHecho(){const h=R.hecho,w=telNorm(R.cat.whatsapp);
  const txt=`Hola! Acabo de reservar hora por la web: ${fLarga(h.fecha)} a las ${h.hora}, ${h.servicios}. Mi nombre es ${h.nombre}.`;
  return`<div class="card done"><div class="ico" aria-hidden="true">✓</div><h2>¡Tu hora quedó reservada!</h2>
  <p style="margin:0">Te esperamos el <b>${esc(fLarga(h.fecha))} a las ${esc(h.hora)}</b>: ${esc(h.servicios)}.</p>
  <p class="muted">${h.mail?`Te enviamos la confirmación a <b>${esc(h.mail)}</b>. `:""}Si necesitas cambiarla o cancelarla, escríbenos por WhatsApp.</p>
  ${w?`<a class="wsp" href="https://wa.me/${w}?text=${encodeURIComponent(txt)}" target="_blank" rel="noopener">Escribirnos por WhatsApp</a>`:""}
  <button class="link" data-a="otra">Pedir otra hora</button></div>`}
function vPrecios(){const C=cats();
  return`<div class="card pl">${C.map(c=>`<h2>${esc(c)}</h2><div>${(R.cat.servicios||[]).filter(s=>s.categoria===c).map(s=>`<div class="row"><span>${esc(s.nombre)}</span><small>${Number(s.duracion)||60} min</small><b>${clp(s.precio)}</b></div>`).join("")}</div>`).join("")}
  <p class="muted">Valores en pesos chilenos, IVA incluido. Lista actualizada al ${esc(new Date().toLocaleDateString("es-CL",{day:"numeric",month:"long",year:"numeric"}))}.</p>
  <button class="cta" data-a="reservar">Reservar tu hora</button></div>`}
function render(){if(!R.cat)return;
  const h1=document.querySelector("header h1");if(h1)h1.textContent=R.precios?"Lista de precios":"Reserva tu hora";
  if(R.precios){document.title="Lista de precios · NÚASPA";$("#app").innerHTML=vPrecios();return}
  document.title="Reserva tu hora · NÚASPA";
  if(R.hecho){$("#app").innerHTML=vHecho();return}
  $("#app").innerHTML=pasos()+({1:vServicios,2:vHora,3:vDatos}[R.step])();}

document.addEventListener("input",e=>{const t=e.target;if(t.id==="r-nom")R.nombre=t.value;if(t.id==="r-tel")R.tel=t.value;if(t.id==="r-nota")R.nota=t.value;if(t.id==="r-mail")R.mail=t.value;if(t.id==="r-wa")R.waOk=t.checked});
document.addEventListener("change",e=>{if(e.target.id==="r-wa")R.waOk=e.target.checked});
document.addEventListener("click",async e=>{const b=e.target.closest("[data-a]");if(!b||b.disabled)return;const a=b.dataset.a,v=b.dataset.v;
  if(a==="reservar"){R.precios=false;render();window.scrollTo({top:0,behavior:"smooth"});return}
  if(a==="cat"){R.catSel=v;render();return}
  if(a==="svc"){const i=R.items.indexOf(v);if(i>=0)R.items.splice(i,1);else if(R.items.length<6)R.items.push(v);R.hora="";render();return}
  if(a==="paso"){R.step=+v;R.error="";render();window.scrollTo({top:0,behavior:"smooth"});return}
  if(a==="pro"){R.pro=v;R.hora="";render();return}
  if(a==="dia"){R.fecha=v;R.hora="";render();return}
  if(a==="hora"){R.hora=v;render();return}
  if(a==="otra"){Object.assign(R,{step:1,items:[],hora:"",hecho:null,nota:"",error:""});render();return}
  if(a==="enviar"){
    const nom=R.nombre.trim().replace(/\s+/g," "),tel=R.tel.trim(),d=tel.replace(/\D/g,"");
    if(nom.length<3){R.error="Escribe tu nombre.";render();return}
    if(d.length<8||d.length>12){R.error="Revisa tu número de WhatsApp (ej. 9 1234 5678).";render();return}
    const mail=R.mail.trim().toLowerCase();if(mail&&!/^[^@\s\[\]]+@[^@\s\[\]]+\.[a-z]{2,}$/.test(mail)){R.error="Revisa tu correo o déjalo en blanco.";render();return}
    R.enviando=true;R.error="";render();
    try{
      const canal=(new URLSearchParams(location.search).get("o")||"").toLowerCase().replace(/[^a-z]/g,"").slice(0,12);const doc={nombre:nom.slice(0,80),telefono:tel.slice(0,20),servicios:R.items.slice(0,6),profId:R.pro||"",fecha:R.fecha,hora:R.hora,nota:((canal?"[origen:"+canal+"] ":"")+(mail?"[correo:"+mail+"] ":"")+(R.waOk?"[wa:si] ":"")+R.nota.trim()).slice(0,300),estado:"nueva",creado:firebase.firestore.FieldValue.serverTimestamp()};
      const ref=await db.collection("solicitudes").add(doc);
      try{fetch("https://surcaja-nuaspa.netlify.app/api/reserva-web",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:ref.id}),keepalive:true}).catch(()=>{})}catch(e){}
      R.hecho={mail,nombre:nom,tel,fecha:R.fecha,hora:R.hora,servicios:sel().map(s=>s.nombre).join(", ")};
    }catch(err){R.error="No pudimos enviar tu solicitud. Revisa tu conexión e intenta de nuevo, o escríbenos por WhatsApp."}
    R.enviando=false;render();window.scrollTo({top:0,behavior:"smooth"});return}
});
init();
</script>
</body>
</html>
